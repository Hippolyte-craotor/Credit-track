<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CreditTrack{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{brand:{50:'#eef7f1',100:'#d6ebdd',200:'#b0d7bf',300:'#7fbf99',400:'#4fa373',500:'#2f855a',600:'#236947',700:'#1c5339',800:'#184430',900:'#143828'}}}}}</script>
  <style>input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:.5rem;padding:.625rem .75rem}input:focus,select:focus,textarea:focus{outline:none;box-shadow:0 0 0 2px rgba(47,133,90,.35);border-color:#2f855a}</style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800">
  <div class="min-h-screen flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-md">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-brand-800 text-white font-bold text-xl mb-3">CT</div>
        <h1 class="text-2xl font-bold text-brand-900">CreditTrack</h1>
        <p class="text-slate-600 mt-1">Suivi simple des crédits et remboursements</p>
      </div>
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8">
        {% if messages %}
          <div class="space-y-2 mb-4">
            {% for message in messages %}
              <div class="px-4 py-3 rounded-lg text-sm {% if message.tags == 'error' %}bg-red-50 text-red-800 border border-red-200{% else %}bg-emerald-50 text-emerald-800 border border-emerald-200{% endif %}">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
        {% block content %}{% endblock %}
      </div>
    </div>
  </div>
</body>
</html>
