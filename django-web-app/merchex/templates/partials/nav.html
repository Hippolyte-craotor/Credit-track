<nav class="space-y-1 text-sm">
  <a href="{% url 'dashboard:index' %}" class="flex items-center gap-3 px-3 py-2.5 rounded-lg {% if request.resolver_match.namespace == 'dashboard' %}bg-brand-800 text-white{% else %}text-brand-100 hover:bg-brand-800 hover:text-white{% endif %}">
    <span>Tableau de bord</span>
  </a>
  <a href="{% url 'customers:list' %}" class="flex items-center gap-3 px-3 py-2.5 rounded-lg {% if request.resolver_match.namespace == 'customers' %}bg-brand-800 text-white{% else %}text-brand-100 hover:bg-brand-800 hover:text-white{% endif %}">
    <span>Clients</span>
  </a>
  <a href="{% url 'credits:list' %}" class="flex items-center gap-3 px-3 py-2.5 rounded-lg {% if request.resolver_match.namespace == 'credits' and request.resolver_match.url_name == 'list' %}bg-brand-800 text-white{% else %}text-brand-100 hover:bg-brand-800 hover:text-white{% endif %}">
    <span>Dettes</span>
  </a>
  <a href="{% url 'reports:history' %}" class="flex items-center gap-3 px-3 py-2.5 rounded-lg {% if request.resolver_match.url_name == 'history' %}bg-brand-800 text-white{% else %}text-brand-100 hover:bg-brand-800 hover:text-white{% endif %}">
    <span>Historique</span>
  </a>
  <a href="{% url 'reports:index' %}" class="flex items-center gap-3 px-3 py-2.5 rounded-lg {% if request.resolver_match.namespace == 'reports' and request.resolver_match.url_name == 'index' %}bg-brand-800 text-white{% else %}text-brand-100 hover:bg-brand-800 hover:text-white{% endif %}">
    <span>Rapports</span>
  </a>
  <div class="pt-4 mt-4 border-t border-brand-700">
    <a href="{% url 'accounts:profile' %}" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-brand-100 hover:bg-brand-800 hover:text-white">Mon profil</a>
    <form action="{% url 'accounts:logout' %}" method="post">
      {% csrf_token %}
      <button type="submit" class="w-full text-left flex items-center gap-3 px-3 py-2.5 rounded-lg text-brand-100 hover:bg-brand-800 hover:text-white">Déconnexion</button>
    </form>
  </div>
</nav>
