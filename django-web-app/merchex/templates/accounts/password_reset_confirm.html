{% extends "base_auth.html" %}
{% block title %}Nouveau mot de passe - CreditTrack{% endblock %}
{% block content %}
<h2 class="text-xl font-semibold mb-1">Nouveau mot de passe</h2>
<p class="text-sm text-slate-600 mb-6">Choisissez un nouveau mot de passe sécurisé.</p>
<form method="post" class="space-y-4">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="w-full bg-brand-800 hover:bg-brand-700 text-white font-medium rounded-lg px-4 py-2.5">Réinitialiser</button>
</form>
{% endblock %}
