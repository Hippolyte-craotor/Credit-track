{% extends "base_auth.html" %}
{% block title %}Mot de passe oublié - CreditTrack{% endblock %}
{% block content %}
<h2 class="text-xl font-semibold mb-1">Mot de passe oublié</h2>
<p class="text-sm text-slate-600 mb-6">Entrez votre e-mail pour recevoir un lien de réinitialisation.</p>
<form method="post" class="space-y-4">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="w-full bg-brand-800 hover:bg-brand-700 text-white font-medium rounded-lg px-4 py-2.5">Envoyer le lien</button>
</form>
<p class="mt-5 text-sm text-center"><a href="{% url 'accounts:login' %}" class="text-brand-700 hover:underline">Retour à la connexion</a></p>
{% endblock %}
