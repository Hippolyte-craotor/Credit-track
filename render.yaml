services:
  - type: web
    name: agriconnect
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: DB_SSL_REQUIRE
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: agriconnect-db
          property: connectionString

databases:
  - name: agriconnect-db
    plan: free
    databaseName: agriconnect
    user: agriconnect
